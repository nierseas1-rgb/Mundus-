name: Build APK

# Compile un APK debug installable sur téléphone/box, à chaque push ou à la demande.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mundus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish a rolling "debug-latest" pre-release so the APK has a stable,
      # direct download URL — ideal for sideloading on Android TV via Downloader.
      - name: Publish APK to debug-latest release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Mundus (debug, dernier build)
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            APK debug le plus récent, reconstruit automatiquement à chaque push.
            Lien direct : téléchargez `app-debug.apk` ci-dessous.
